<!DOCTYPE html>
<html>
<head>
<style>
	
/* <weight>: Use a value from 100 to 800 */
/* <uniquifier>: Use a unique and descriptive class name */

.container {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  gap: 16px; 
  padding: 40px; 
  margin: 0 auto; 

}

body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #0b0f1a;
  color: white;
}
    
h1 {
  color: steelblue;
  text-align: center;
  margin-top: 40px;
  font-size: 100px;
  font-family: "JetBrains Mono", monospace;
  font-weight: 800;

}
    
.button {
  border: none;
  color: #0b0f1a;
  padding: 16px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  transition-duration: 0.3s;
  cursor: pointer;
  min-width: 140px;
  border-radius: 16px;
  background-color: #0b0f1a;
  color: white;
  border: 2px solid SteelBlue;
}


.button:hover {
  transform: translateY(-3px);
  background-color: SteelBlue;
  color: white;
  box-shadow: 0 0 10px SteelBlue,
              0 0 20px SteelBlue,
              0 0 40px SteelBlue,
              0 0 80px SteelBlue;
}

</style>
    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

</head>
<body>

<h1>Reyfly</h1>

<div class="container">
    
    <a class="button " href="Addition">Home</a>
    <a class="button " href="Subtraction">Games</a>
    <a class="button " href="Multiplication">Contact</a>
    <a class="button " href="Division">About</a>
</div>

</body>
</html>
